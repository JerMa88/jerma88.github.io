# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: emerald

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Personal academic website of Zerui "Jerry" Ma — Ph.D. Student in Electrical Engineering and Moody Graduate Fellow at Southern Methodist University. Former Research Scientist Intern at AT&T Chief Data Office. Published in ACS JCTC, APA JOPACS, AAAI, and NAACL. Research in ML pre/post-training & alignment, low-precision inference acceleration (NVFP4/FP8), agentic AI (MCP, GraphRAG), and quantum error detection.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    fixed_to_top: true
    show_search: false
    show_theme_chooser: true
    logo:
      text: "Zerui \"Jerry\" Ma"

# Site footer
footer:
  copyright:
    notice: '© {year} Zerui "Jerry" Ma. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false
